[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-agent"
version = "0.1.0"
description = "Minimal hybrid engineering agent: deterministic shell, LLM proposals, human authority"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Exact pins, so a red CI run means the code changed and not the linter. These are
# the versions the green run of 30 October 2026 installed; raise them on purpose,
# in a change of their own (docs/decisions.md, 31 October 2026).
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[tool.setuptools]
packages = ["hybrid_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
